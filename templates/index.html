<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 投资组合仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #0f1117;
  color: #e1e4e8;
  min-height: 100vh;
}
a { color: #58a6ff; text-decoration: none; }

/* Header */
.header {
  background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
  border-bottom: 1px solid #21262d;
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.header h1 { font-size: 20px; font-weight: 600; }
.header h1 span { color: #58a6ff; }
.header-actions { display: flex; gap: 12px; align-items: center; }
.btn {
  background: #21262d;
  color: #c9d1d9;
  border: 1px solid #30363d;
  padding: 6px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: background 0.15s;
}
.btn:hover { background: #30363d; }
.btn-primary { background: #238636; border-color: #2ea043; color: #fff; }
.btn-primary:hover { background: #2ea043; }
.status { font-size: 12px; color: #8b949e; }

/* Layout */
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }

/* Score Cards */
.score-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.score-card {
  background: #161b22;
  border: 1px solid #21262d;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
}
.score-card .label { font-size: 13px; color: #8b949e; margin-bottom: 8px; }
.score-card .value { font-size: 28px; font-weight: 700; }
.score-card .sub { font-size: 12px; color: #8b949e; margin-top: 4px; }
.green { color: #3fb950; }
.red { color: #f85149; }
.blue { color: #58a6ff; }
.yellow { color: #d29922; }

/* Panels */
.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}
.panel {
  background: #161b22;
  border: 1px solid #21262d;
  border-radius: 12px;
  padding: 20px;
}
.panel-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid #21262d;
}
.panel-full { grid-column: 1 / -1; }

/* Table */
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left;
  font-size: 12px;
  color: #8b949e;
  padding: 8px 12px;
  border-bottom: 1px solid #21262d;
  font-weight: 500;
  white-space: nowrap;
}
td {
  padding: 10px 12px;
  font-size: 13px;
  border-bottom: 1px solid #21262d08;
}
tr:hover { background: #1c2128; }
.text-right { text-align: right; }
.mono { font-family: "SF Mono", "Fira Code", monospace; font-size: 12px; }

/* Segment badge */
.seg-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
}
.seg-Models\/Cloud { background: #1f3a5f; color: #79c0ff; }
.seg-Chips\/GPU { background: #3b2f00; color: #f0c040; }
.seg-Optical\/Networking { background: #0f3d1e; color: #56d364; }
.seg-Storage { background: #3d1f3f; color: #d2a8ff; }
.seg-HPC\/Infrastructure { background: #3d2b1f; color: #ffa657; }
.seg-Mining-to-HPC { background: #1f2d3d; color: #a5d6ff; }

/* Chart container */
.chart-container { position: relative; height: 280px; }

/* Suggestion cards */
.suggestion {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 8px;
  background: #1c2128;
}
.suggestion .action-badge {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.action-BUY { background: #238636; color: #fff; }
.action-ADD { background: #1f6feb; color: #fff; }
.action-TRIM { background: #d29922; color: #000; }
.action-SELL { background: #da3633; color: #fff; }
.suggestion .info { flex: 1; }
.suggestion .ticker { font-weight: 600; font-size: 14px; }
.suggestion .reason { font-size: 12px; color: #8b949e; margin-top: 4px; }
.suggestion .priority {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: #21262d;
  color: #8b949e;
}

/* AI Chain Map */
.chain-map {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 20px 0;
  overflow-x: auto;
}
.chain-node {
  text-align: center;
  padding: 16px;
  border-radius: 12px;
  min-width: 140px;
  background: #1c2128;
  border: 2px solid #30363d;
  position: relative;
}
.chain-node.active { border-color: #58a6ff; box-shadow: 0 0 16px rgba(88,166,255,0.15); }
.chain-node .seg-name { font-size: 12px; font-weight: 600; margin-bottom: 6px; }
.chain-node .seg-pct { font-size: 22px; font-weight: 700; color: #58a6ff; }
.chain-node .seg-target { font-size: 11px; color: #8b949e; }
.chain-node .seg-tickers { font-size: 11px; color: #c9d1d9; margin-top: 8px; }
.chain-arrow {
  font-size: 24px;
  color: #30363d;
  padding: 0 4px;
  flex-shrink: 0;
}

/* Gap badge */
.gap-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 6px;
  font-size: 12px;
  background: #da363322;
  color: #f85149;
  border: 1px solid #da363344;
  margin: 4px;
}

/* Tabs */
.tabs { display: flex; gap: 0; margin-bottom: 20px; }
.tab {
  padding: 8px 20px;
  cursor: pointer;
  font-size: 14px;
  color: #8b949e;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.tab:hover { color: #c9d1d9; }
.tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Screener table */
.filter-row {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.filter-row select, .filter-row input {
  background: #0d1117;
  border: 1px solid #30363d;
  color: #c9d1d9;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
}

/* Loading */
.loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 60vh;
  gap: 16px;
}
.spinner {
  width: 40px; height: 40px;
  border: 3px solid #21262d;
  border-top-color: #58a6ff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Responsive */
@media (max-width: 900px) {
  .panels { grid-template-columns: 1fr; }
  .score-cards { grid-template-columns: repeat(2, 1fr); }
  .chain-map { flex-direction: column; }
  .chain-arrow { transform: rotate(90deg); }
}
</style>
</head>
<body>

<div class="header">
  <h1><span>AI</span> 投资组合仪表盘</h1>
  <div class="header-actions">
    <span class="status" id="lastUpdate"></span>
    <button class="btn" onclick="refreshData()">刷新行情</button>
  </div>
</div>

<div class="container">
  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('overview')">总览</div>
    <div class="tab" onclick="switchTab('rebalance')">调仓建议</div>
    <div class="tab" onclick="switchTab('screener')">AI 选股器</div>
  </div>

  <!-- Loading -->
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div>正在获取行情数据...</div>
  </div>

  <!-- Overview Tab -->
  <div id="tab-overview" class="tab-content">
    <!-- Score Cards -->
    <div class="score-cards">
      <div class="score-card">
        <div class="label">总市值 (USD)</div>
        <div class="value blue" id="totalValue">--</div>
        <div class="sub" id="cashInfo"></div>
      </div>
      <div class="score-card">
        <div class="label">总盈亏</div>
        <div class="value" id="totalPnl">--</div>
        <div class="sub" id="pnlPct"></div>
      </div>
      <div class="score-card">
        <div class="label">AI 纯度</div>
        <div class="value blue" id="aiScore">--</div>
        <div class="sub">加权 AI 营收评分</div>
      </div>
      <div class="score-card">
        <div class="label">链路覆盖</div>
        <div class="value blue" id="chainCoverage">--</div>
        <div class="sub" id="coverageSub"></div>
      </div>
      <div class="score-card">
        <div class="label">集中度风险</div>
        <div class="value" id="riskLevel">--</div>
        <div class="sub" id="hhiInfo"></div>
      </div>
    </div>

    <!-- Charts Row -->
    <div class="panels">
      <div class="panel">
        <div class="panel-title">板块分布</div>
        <div class="chart-container"><canvas id="segChart"></canvas></div>
      </div>
      <div class="panel">
        <div class="panel-title">目标 vs 当前配置</div>
        <div class="chart-container"><canvas id="targetChart"></canvas></div>
      </div>
    </div>

    <!-- AI Chain Map -->
    <div class="panel panel-full" style="margin-bottom:24px">
      <div class="panel-title">AI 价值链全景</div>
      <div class="chain-map" id="chainMap"></div>
      <div id="gapsArea" style="margin-top:12px"></div>
    </div>

    <!-- Holdings Table -->
    <div class="panel panel-full" style="margin-bottom:24px">
      <div class="panel-title">持仓明细</div>
      <table>
        <thead>
          <tr>
            <th>代码</th>
            <th>名称</th>
            <th>板块</th>
            <th>AI纯度</th>
            <th class="text-right">现价</th>
            <th class="text-right">成本</th>
            <th class="text-right">盈亏%</th>
            <th class="text-right">日涨跌</th>
            <th class="text-right">市值(USD)</th>
            <th class="text-right">占比</th>
          </tr>
        </thead>
        <tbody id="holdingsBody"></tbody>
      </table>
    </div>

    <!-- PnL Winners/Losers -->
    <div class="panels">
      <div class="panel">
        <div class="panel-title" style="color:#3fb950">最佳表现</div>
        <div id="winners"></div>
      </div>
      <div class="panel">
        <div class="panel-title" style="color:#f85149">最差表现</div>
        <div id="losers"></div>
      </div>
    </div>
  </div>

  <!-- Rebalance Tab -->
  <div id="tab-rebalance" class="tab-content">
    <div id="rebalanceLoading" class="loading" style="height:40vh">
      <div class="spinner"></div>
      <div>正在分析调仓...</div>
    </div>
    <div id="rebalanceContent" style="display:none">
      <div class="panels" style="margin-bottom:24px">
        <div class="panel">
          <div class="panel-title">配置偏离度</div>
          <div class="chart-container"><canvas id="deviationChart"></canvas></div>
        </div>
        <div class="panel">
          <div class="panel-title">调仓建议</div>
          <div id="suggestions"></div>
        </div>
      </div>
      <div class="panel panel-full">
        <div class="panel-title">缺失板块推荐</div>
        <div id="gapRecs"></div>
      </div>
    </div>
  </div>

  <!-- Screener Tab -->
  <div id="tab-screener" class="tab-content">
    <div class="panel panel-full">
      <div class="panel-title">AI 链路股票池</div>
      <div class="filter-row">
        <select id="segFilter" onchange="loadScreener()">
          <option value="">全部板块</option>
          <option value="Models/Cloud">模型与云</option>
          <option value="Chips/GPU">芯片/GPU</option>
          <option value="Optical/Networking">光通信网络</option>
          <option value="Storage">存储</option>
          <option value="HPC/Infrastructure">HPC基础设施</option>
          <option value="Mining-to-HPC">矿转HPC</option>
        </select>
        <select id="marketFilter" onchange="loadScreener()">
          <option value="">全部市场</option>
          <option value="US">美股</option>
          <option value="HK">港股</option>
        </select>
        <input type="number" id="minScore" placeholder="最低AI纯度" min="0" max="100" onchange="loadScreener()">
      </div>
      <table>
        <thead>
          <tr>
            <th>代码</th>
            <th>名称</th>
            <th>中文名</th>
            <th>板块</th>
            <th>子主题</th>
            <th>市场</th>
            <th class="text-right">AI纯度</th>
          </tr>
        </thead>
        <tbody id="screenerBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const SEGMENT_COLORS = {
  'Models/Cloud': '#79c0ff',
  'Chips/GPU': '#f0c040',
  'Optical/Networking': '#56d364',
  'Storage': '#d2a8ff',
  'HPC/Infrastructure': '#ffa657',
  'Mining-to-HPC': '#a5d6ff',
};

const SEGMENT_CN = {
  'Models/Cloud': '模型与云',
  'Chips/GPU': '芯片/GPU',
  'Optical/Networking': '光通信',
  'Storage': '存储',
  'HPC/Infrastructure': 'HPC基础设施',
  'Mining-to-HPC': '矿转HPC',
};

const CHAIN_ORDER = ['Models/Cloud', 'Chips/GPU', 'Optical/Networking', 'Storage', 'HPC/Infrastructure', 'Mining-to-HPC'];

let segChart, targetChart, deviationChart;
let dashboardData = null;

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', t.textContent.includes(
      tab === 'overview' ? '总览' : tab === 'rebalance' ? '调仓' : '选股'
    ));
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');

  if (tab === 'rebalance') loadRebalance();
  if (tab === 'screener') loadScreener();
}

function fmt(n) {
  return n.toLocaleString('en-US', { maximumFractionDigits: 0 });
}

function fmtPct(n) {
  return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
}

function pnlColor(n) {
  return n >= 0 ? 'green' : 'red';
}

async function loadDashboard() {
  try {
    const resp = await fetch('/api/dashboard');
    const data = await resp.json();
    dashboardData = data;
    renderDashboard(data);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('tab-overview').classList.add('active');
    document.getElementById('lastUpdate').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
  } catch (e) {
    document.getElementById('loading').innerHTML = '<div style="color:#f85149">加载失败，请检查网络或配置文件</div>';
  }
}

function renderDashboard(data) {
  const s = data.summary;

  // Score cards
  document.getElementById('totalValue').textContent = '$' + fmt(s.total_value_usd);
  document.getElementById('cashInfo').textContent = '含现金 $' + fmt(s.cash_usd);

  const pnlEl = document.getElementById('totalPnl');
  pnlEl.textContent = (s.total_pnl_usd >= 0 ? '+$' : '-$') + fmt(Math.abs(s.total_pnl_usd));
  pnlEl.className = 'value ' + pnlColor(s.total_pnl_usd);
  const pctEl = document.getElementById('pnlPct');
  pctEl.textContent = fmtPct(s.total_pnl_pct);
  pctEl.className = 'sub ' + pnlColor(s.total_pnl_pct);

  document.getElementById('aiScore').textContent = s.ai_score.toFixed(1);
  document.getElementById('chainCoverage').textContent = s.chain_coverage.toFixed(1);
  const covered = CHAIN_ORDER.length - data.gaps.length;
  document.getElementById('coverageSub').textContent = `覆盖 ${covered}/${CHAIN_ORDER.length} 板块`;

  const riskEl = document.getElementById('riskLevel');
  riskEl.textContent = s.risk_level;
  riskEl.className = 'value ' + (s.risk_level.includes('极高') || s.risk_level.includes('高') ? 'red' : s.risk_level.includes('中') ? 'yellow' : 'green');
  document.getElementById('hhiInfo').textContent = 'HHI: ' + s.hhi.toFixed(4);

  // Segment pie chart
  renderSegChart(data.segment_allocation);

  // Target vs current chart
  renderTargetChart(data.segment_allocation, data.target_allocation);

  // Chain map
  renderChainMap(data);

  // Holdings table
  renderHoldings(data.holdings);

  // Winners/losers
  renderPnlList('winners', data.pnl.winners, true);
  renderPnlList('losers', data.pnl.losers, false);
}

function renderSegChart(allocation) {
  const labels = Object.keys(allocation).map(k => SEGMENT_CN[k] || k);
  const values = Object.values(allocation);
  const colors = Object.keys(allocation).map(k => SEGMENT_COLORS[k] || '#666');

  if (segChart) segChart.destroy();
  segChart = new Chart(document.getElementById('segChart'), {
    type: 'doughnut',
    data: {
      labels: labels,
      datasets: [{ data: values, backgroundColor: colors, borderWidth: 0 }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'right',
          labels: { color: '#c9d1d9', font: { size: 12 }, padding: 12 }
        },
        tooltip: {
          callbacks: {
            label: ctx => `${ctx.label}: ${ctx.raw.toFixed(1)}%`
          }
        }
      }
    }
  });
}

function renderTargetChart(current, targets) {
  const labels = CHAIN_ORDER.map(k => SEGMENT_CN[k] || k);
  const currentData = CHAIN_ORDER.map(k => current[k] || 0);
  const targetData = CHAIN_ORDER.map(k => targets[k] || 0);

  if (targetChart) targetChart.destroy();
  targetChart = new Chart(document.getElementById('targetChart'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        { label: '当前', data: currentData, backgroundColor: '#58a6ff88', borderColor: '#58a6ff', borderWidth: 1 },
        { label: '目标', data: targetData, backgroundColor: '#3fb95044', borderColor: '#3fb950', borderWidth: 1, borderDash: [5, 5] }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { ticks: { color: '#8b949e', font: { size: 10 } }, grid: { color: '#21262d' } },
        y: { ticks: { color: '#8b949e', callback: v => v + '%' }, grid: { color: '#21262d' } }
      },
      plugins: {
        legend: { labels: { color: '#c9d1d9', font: { size: 12 } } },
        tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.raw.toFixed(1)}%` } }
      }
    }
  });
}

function renderChainMap(data) {
  const container = document.getElementById('chainMap');
  container.innerHTML = '';

  // Gather tickers by segment from holdings
  const tickersBySeg = {};
  data.holdings.forEach(h => {
    if (h.segment !== 'N/A') {
      if (!tickersBySeg[h.segment]) tickersBySeg[h.segment] = [];
      tickersBySeg[h.segment].push(h.ticker);
    }
  });

  CHAIN_ORDER.forEach((seg, i) => {
    if (i > 0) {
      const arrow = document.createElement('div');
      arrow.className = 'chain-arrow';
      arrow.textContent = '\u2192';
      container.appendChild(arrow);
    }

    const node = document.createElement('div');
    const pct = data.segment_allocation[seg] || 0;
    const target = data.target_allocation[seg] || 0;
    const isActive = pct > 0;
    node.className = 'chain-node' + (isActive ? ' active' : '');

    const tickers = tickersBySeg[seg] || [];
    node.innerHTML = `
      <div class="seg-name" style="color:${SEGMENT_COLORS[seg]}">${SEGMENT_CN[seg]}</div>
      <div class="seg-pct">${pct.toFixed(1)}%</div>
      <div class="seg-target">目标 ${target}%</div>
      ${tickers.length ? '<div class="seg-tickers">' + tickers.join(' ') + '</div>' : '<div class="seg-tickers" style="color:#8b949e">未持仓</div>'}
    `;
    container.appendChild(node);
  });

  // Gaps
  const gapsArea = document.getElementById('gapsArea');
  if (data.gaps.length > 0) {
    gapsArea.innerHTML = '<span style="font-size:13px;color:#8b949e;margin-right:8px;">未覆盖板块:</span>' +
      data.gaps.map(g => `<span class="gap-badge">${SEGMENT_CN[g] || g}</span>`).join('');
  } else {
    gapsArea.innerHTML = '<span style="font-size:13px;color:#3fb950;">已全部覆盖 AI 价值链六大板块</span>';
  }
}

function renderHoldings(holdings) {
  const tbody = document.getElementById('holdingsBody');
  tbody.innerHTML = holdings.map(h => `
    <tr>
      <td class="mono" style="font-weight:600">${h.ticker}</td>
      <td>${h.name_cn || h.name}</td>
      <td><span class="seg-badge seg-${h.segment}">${SEGMENT_CN[h.segment] || h.segment}</span></td>
      <td class="mono">${h.ai_score}</td>
      <td class="text-right mono">${h.currency === 'HKD' ? 'HK$' : '$'}${h.current_price.toFixed(2)}</td>
      <td class="text-right mono">${h.currency === 'HKD' ? 'HK$' : '$'}${h.avg_cost.toFixed(2)}</td>
      <td class="text-right mono ${pnlColor(h.pnl_pct)}">${fmtPct(h.pnl_pct)}</td>
      <td class="text-right mono ${pnlColor(h.day_change_pct)}">${fmtPct(h.day_change_pct)}</td>
      <td class="text-right mono">$${fmt(h.market_value_usd)}</td>
      <td class="text-right mono">${h.weight_pct.toFixed(1)}%</td>
    </tr>
  `).join('');
}

function renderPnlList(id, items, isWinner) {
  const el = document.getElementById(id);
  if (!items.length) {
    el.innerHTML = '<div style="color:#8b949e;font-size:13px;padding:8px">暂无</div>';
    return;
  }
  el.innerHTML = items.map(([ticker, pct]) => `
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #21262d">
      <span class="mono" style="font-weight:600">${ticker}</span>
      <span class="mono ${isWinner ? 'green' : 'red'}">${fmtPct(pct)}</span>
    </div>
  `).join('');
}

async function loadRebalance() {
  const loading = document.getElementById('rebalanceLoading');
  const content = document.getElementById('rebalanceContent');
  loading.style.display = 'flex';
  content.style.display = 'none';

  try {
    const resp = await fetch('/api/rebalance');
    const data = await resp.json();
    renderRebalance(data);
    loading.style.display = 'none';
    content.style.display = 'block';
  } catch (e) {
    loading.innerHTML = '<div style="color:#f85149">加载失败</div>';
  }
}

function renderRebalance(data) {
  // Deviation chart
  const labels = CHAIN_ORDER.map(k => SEGMENT_CN[k] || k);
  const deviations = CHAIN_ORDER.map(k => {
    const c = data.current[k] || 0;
    const t = data.targets[k] || 0;
    return c - t;
  });
  const devColors = deviations.map(d => d > 0 ? '#f8514988' : '#3fb95088');

  if (deviationChart) deviationChart.destroy();
  deviationChart = new Chart(document.getElementById('deviationChart'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{ label: '偏离度 (%)', data: deviations, backgroundColor: devColors, borderWidth: 0 }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: 'y',
      scales: {
        x: { ticks: { color: '#8b949e', callback: v => v + '%' }, grid: { color: '#21262d' } },
        y: { ticks: { color: '#c9d1d9', font: { size: 12 } }, grid: { display: false } }
      },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => `偏离: ${ctx.raw > 0 ? '+' : ''}${ctx.raw.toFixed(1)}%` } }
      }
    }
  });

  // Suggestions
  const sugEl = document.getElementById('suggestions');
  if (!data.suggestions.length) {
    sugEl.innerHTML = '<div style="color:#3fb950;font-size:14px;padding:20px;text-align:center">当前配置合理，无需调仓</div>';
  } else {
    sugEl.innerHTML = data.suggestions.map(s => `
      <div class="suggestion">
        <span class="action-badge action-${s.action}">${s.action}</span>
        <div class="info">
          <div class="ticker">${s.ticker} <span style="font-weight:400;color:#8b949e;font-size:12px">${s.name}</span></div>
          <div class="reason">${s.reason}</div>
        </div>
        <span class="priority">P${s.priority}</span>
      </div>
    `).join('');
  }

  // Gap recommendations
  const gapEl = document.getElementById('gapRecs');
  const gapRecs = data.gap_recommendations;
  if (!Object.keys(gapRecs).length) {
    gapEl.innerHTML = '<div style="color:#3fb950;font-size:14px;padding:12px">已全部覆盖</div>';
  } else {
    gapEl.innerHTML = Object.entries(gapRecs).map(([seg, stocks]) => `
      <div style="margin-bottom:16px">
        <div style="font-weight:600;margin-bottom:8px;color:${SEGMENT_COLORS[seg] || '#c9d1d9'}">${SEGMENT_CN[seg] || seg}</div>
        ${stocks.map(s => `
          <div style="display:flex;gap:16px;padding:6px 12px;font-size:13px">
            <span class="mono" style="font-weight:600;min-width:80px">${s.ticker}</span>
            <span style="min-width:100px">${s.name_cn}</span>
            <span style="color:#8b949e;flex:1">${s.sub_theme}</span>
            <span class="mono blue">AI ${s.ai_chain_score}</span>
          </div>
        `).join('')}
      </div>
    `).join('');
  }
}

async function loadScreener() {
  const segment = document.getElementById('segFilter').value;
  const market = document.getElementById('marketFilter').value;
  const minScore = document.getElementById('minScore').value;

  let url = '/api/screener?';
  if (segment) url += 'segment=' + encodeURIComponent(segment) + '&';
  if (market) url += 'market=' + market + '&';
  if (minScore) url += 'min_score=' + minScore;

  try {
    const resp = await fetch(url);
    const data = await resp.json();
    renderScreener(data);
  } catch (e) {
    document.getElementById('screenerBody').innerHTML = '<tr><td colspan="7" style="color:#f85149">加载失败</td></tr>';
  }
}

function renderScreener(stocks) {
  const tbody = document.getElementById('screenerBody');
  tbody.innerHTML = stocks.map(s => `
    <tr>
      <td class="mono" style="font-weight:600">${s.ticker}</td>
      <td>${s.name}</td>
      <td>${s.name_cn}</td>
      <td><span class="seg-badge seg-${s.segment}">${SEGMENT_CN[s.segment] || s.segment}</span></td>
      <td style="font-size:12px;color:#8b949e">${s.sub_theme}</td>
      <td>${s.market === 'HK' ? '港股' : '美股'}</td>
      <td class="text-right mono blue" style="font-weight:600">${s.ai_chain_score}</td>
    </tr>
  `).join('');
}

async function refreshData() {
  await fetch('/api/refresh', { method: 'POST' });
  location.reload();
}

// Init
loadDashboard();
